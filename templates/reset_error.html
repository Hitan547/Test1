<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Link Error – Qatar Foundation</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: #f5f5f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: #fff; border-radius: 16px; padding: 40px; max-width: 420px; width: 90%; box-shadow: 0 2px 20px rgba(0,0,0,0.08); text-align: center; }
        .logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 28px; }
        .logo img { width: 36px; height: 36px; object-fit: contain; }
        .logo span { font-weight: 600; font-size: 16px; color: #1a1a1a; }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h2 { font-size: 20px; font-weight: 600; color: #1a1a1a; margin-bottom: 10px; }
        p { font-size: 14px; color: #6b7280; margin-bottom: 24px; line-height: 1.6; }
        .btn { display: inline-block; padding: 11px 28px; background: #2d7a50; color: #fff; border-radius: 8px; font-size: 14px; font-weight: 500; font-family: inherit; text-decoration: none; }
        .btn:hover { background: #246040; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <img src="https://iconape.com/wp-content/files/hz/20759/png/Qatar-Foundation-01.png" alt="Qatar Foundation">
            <span>Qatar Foundation</span>
        </div>
        <div class="icon">⚠️</div>
        <h2>Reset Link Error</h2>
        <p>{{ error }}</p>
        <a href="/" class="btn">Back to Login</a>
    </div>
</body>
</html>
